<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bright warm ivory halo disc for maximum tab contrast -->
  <circle cx="16" cy="16" r="15" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Left Ear -->
  <ellipse cx="7" cy="16" rx="5" ry="6" fill="#FB923C" stroke="#C2410C" stroke-width="0.8"/>
  <ellipse cx="7" cy="16" rx="2.5" ry="3.5" fill="#FDA4AF"/>
  <!-- Right Ear -->
  <ellipse cx="25" cy="16" rx="5" ry="6" fill="#FB923C" stroke="#C2410C" stroke-width="0.8"/>
  <ellipse cx="25" cy="16" rx="2.5" ry="3.5" fill="#FDA4AF"/>
  <!-- Face -->
  <ellipse cx="16" cy="17" rx="8" ry="7.5" fill="#FDBA74" stroke="#C2410C" stroke-width="0.8"/>
  <!-- Golden Crown (Mukut) -->
  <path d="M11 11 L16 2 L21 11 Z" fill="#FDE047" stroke="#B45309" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="10" y="9" width="12" height="2.5" rx="0.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.6"/>
  <circle cx="16" cy="5.5" r="1.3" fill="#DC2626"/>
  <!-- Sacred Tilak -->
  <path d="M13 13 C14.5 14.8 17.5 14.8 19 13" stroke="#DC2626" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <circle cx="16" cy="12" r="0.9" fill="#DC2626"/>
  <!-- Eyes -->
  <circle cx="13" cy="15" r="0.9" fill="#78350F"/>
  <circle cx="19" cy="15" r="0.9" fill="#78350F"/>
  <!-- Ivory Tusk (Ekadanta) -->
  <path d="M12 19 L9 20" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Curved Golden Trunk (Vakratunda) -->
  <path d="M16 17 C16 21 15 25 18 25 C20 25 21 23 21 21 C21 19.5 19 19.5 18 21" fill="none" stroke="#EAB308" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Golden Modak Sweet -->
  <circle cx="23" cy="21" r="2.8" fill="#FBBF24" stroke="#B45309" stroke-width="0.8"/>
  <circle cx="23" cy="20" r="0.8" fill="#DC2626"/>
</svg>